[project]
name = "agent-harness-aibom"
version = "0.11.0"
description = "AIBOM generator for AI agent harnesses (Hermes, OpenClaw) and their model/skill/MCP/hook surface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ajay Kumar Yegireddi" }]
dependencies = [
    "PyYAML>=6.0",
]

# Shown as "Project links" in the PyPI sidebar -- fixes a real gap: a
# test-only release still bumps the version with nothing visible on the
# PyPI page itself to explain why. Changelog points at GitHub Releases,
# where every version's actual notes live.
[project.urls]
Homepage = "https://github.com/Aj7Ay/agent-harness-aibom"
Repository = "https://github.com/Aj7Ay/agent-harness-aibom"
Changelog = "https://github.com/Aj7Ay/agent-harness-aibom/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Real CycloneDX 1.6 schema validation for tests/test_cyclonedx_schema.py
    # -- catches an invalid `type`/array-placement bug that this package's
    # own hand-rolled validate.py can't, since validate.py checks structure
    # against SPEC.md, not the actual CycloneDX schema.
    "cyclonedx-python-lib[json-validation]>=8.0",
    # Real SARIF 2.1.0 schema validation for tests/test_sarif.py (the
    # schema itself is vendored at tests/fixtures/sarif-schema-2.1.0.json,
    # not fetched at test time). Declared explicitly rather than relying
    # on it staying a transitive dependency of cyclonedx-python-lib's own
    # json-validation extra above, which happens to pull it in today but
    # isn't a promise this project should depend on silently.
    "jsonschema>=4.0",
]

[project.scripts]
harness-aibom = "harness_aibom.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# v0.8.3: signing_config_offline.json (sign.py's vendored, offline-safe
# cosign signing config -- see its own docstring) is a non-.py file.
# setuptools does NOT include non-Python files in a package by default --
# confirmed real gap: without this, the file exists in the source
# checkout and every test passes locally, but a real `uv build` produced
# a wheel/sdist missing it entirely, which would have made `sign_blob()`'s
# own default path a silent 404 for anyone installing from PyPI. Verified
# against a real build (`uv build`, then `tar tzf`/`zipfile` on the actual
# output), not just this declaration -- see test_packaging.py.
[tool.setuptools.package-data]
harness_aibom = ["signing_config_offline.json"]
