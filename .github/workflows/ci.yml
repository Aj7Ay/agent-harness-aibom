name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Both pinned past their Node 20 releases -- GitHub is deprecating
      # Node 20 runners; @v4/@v5 warned "targets Node.js 20 but forced to
      # run on Node.js 24". actions/checkout@v7 and astral-sh/setup-uv's
      # exact v10.0.1 tag both confirmed (by reading their real
      # action.yml) to declare `using: node24` themselves -- setup-uv has
      # no floating major tag past v5, only exact release tags, so this
      # one is pinned exactly rather than to a nonexistent "v10".
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # v0.8.2: sign/verify-signature's own tests (test_sign.py,
      # test_cli.py) skip themselves entirely when cosign isn't on PATH --
      # installed here specifically so those real, non-mocked subprocess
      # tests actually run in CI too, not just locally.
      #
      # Both the action version and the cosign-release are pinned exactly,
      # not left floating -- confirmed real breakage from floating @v3:
      # it resolved to an old cosign-installer release whose bootstrap
      # verification script only knows the legacy `<file>.sig` detached-
      # signature naming. cosign v3.1.3's own release assets dropped that
      # in favor of `<file>.sigstore.json` bundles, so @v3 failed outright
      # trying to download a `.sig` file that release no longer publishes
      # (curl exit 22, i.e. 404). v4.1.2's install script checks for the
      # `.sigstore.json` bundle first (confirmed by reading its actual
      # script source, not guessed) and only falls back to `.sig` for an
      # older cosign release that doesn't have one -- pinned here instead.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pinned to the exact cosign version sign.py's own docstring/
          # SPEC.md claim was verified against -- an unpinned/older
          # default has no --signing-config flag at all ("unknown flag"),
          # which broke every sign/verify test in CI despite passing
          # locally against v3.1.3.
          cosign-release: 'v3.1.3'

      - name: Install the package and dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-test the CLI against the fixtures
        run: |
          uv run harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/hermes-aibom.json
          uv run harness-aibom validate /tmp/hermes-aibom.json
