name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # v0.8.2: sign/verify-signature's own tests (test_sign.py,
      # test_cli.py) skip themselves entirely when cosign isn't on PATH --
      # installed here specifically so those real, non-mocked subprocess
      # tests actually run in CI too, not just locally.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned to the exact version sign.py's own docstring/SPEC.md
          # claim was verified against -- the action's own unpinned
          # default resolved to v2.5.2, which has no --signing-config
          # flag at all ("unknown flag") and broke every sign/verify
          # test in CI despite passing locally against v3.1.3.
          cosign-release: 'v3.1.3'

      - name: Install the package and dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-test the CLI against the fixtures
        run: |
          uv run harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/hermes-aibom.json
          uv run harness-aibom validate /tmp/hermes-aibom.json
