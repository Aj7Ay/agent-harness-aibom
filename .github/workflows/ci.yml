name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-test the CLI against the fixtures
        run: |
          uv run harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/hermes-aibom.json
          uv run harness-aibom validate /tmp/hermes-aibom.json
