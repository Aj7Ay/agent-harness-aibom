name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Both pinned past their Node 20 releases -- GitHub is deprecating
      # Node 20 runners; @v4/@v5 warned "targets Node.js 20 but forced to
      # run on Node.js 24". actions/checkout@v7 and astral-sh/setup-uv's
      # exact v10.0.1 tag both confirmed (by reading their real
      # action.yml) to declare `using: node24` themselves -- setup-uv has
      # no floating major tag past v5, only exact release tags, so this
      # one is pinned exactly rather than to a nonexistent "v10".
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # v0.8.2: sign/verify-signature's own tests (test_sign.py,
      # test_cli.py) skip themselves entirely when cosign isn't on PATH --
      # installed here specifically so those real, non-mocked subprocess
      # tests actually run in CI too, not just locally.
      #
      # Both the action version and the cosign-release are pinned exactly,
      # not left floating -- confirmed real breakage from floating @v3:
      # it resolved to an old cosign-installer release whose bootstrap
      # verification script only knows the legacy `<file>.sig` detached-
      # signature naming. cosign v3.1.3's own release assets dropped that
      # in favor of `<file>.sigstore.json` bundles, so @v3 failed outright
      # trying to download a `.sig` file that release no longer publishes
      # (curl exit 22, i.e. 404). v4.1.2's install script checks for the
      # `.sigstore.json` bundle first (confirmed by reading its actual
      # script source, not guessed) and only falls back to `.sig` for an
      # older cosign release that doesn't have one -- pinned here instead.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pinned to the exact cosign version sign.py's own docstring/
          # SPEC.md claim was verified against -- an unpinned/older
          # default has no --signing-config flag at all ("unknown flag"),
          # which broke every sign/verify test in CI despite passing
          # locally against v3.1.3.
          cosign-release: 'v3.1.3'

      - name: Install the package and dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-test the CLI against the fixtures
        run: |
          uv run harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/hermes-aibom.json
          uv run harness-aibom validate /tmp/hermes-aibom.json

  # v0.10.1: run separately from the main `test` job above (which already
  # includes this same file) so a real CycloneDX-schema failure shows up
  # as its own, clearly labeled, impossible-to-miss check -- a reviewer
  # named this "the highest-yield check in the whole list": it alone
  # would have caught the real v0.1.2 `type: "service"` defect and the
  # v0.2.4 idn-email defect before either ever shipped.
  schema-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Install the package and dev dependencies
        run: uv sync --extra dev
      - name: Validate every real document this project produces against the real CycloneDX 1.6 AND 1.7 schemas
        run: uv run pytest tests/test_cyclonedx_schema.py tests/test_sarif.py -v

  # v0.10.1: the only way the sdist/wheel *packaging* gap from v0.1.11
  # (tests/ accidentally shipped) or a later one (v0.8.3's vendored
  # signing_config_offline.json silently missing from a built wheel)
  # would ever show up -- `uv run pytest` from a checkout never builds
  # or installs the actual distributable artifact, so a packaging-only
  # regression is invisible to every other job in this file.
  build-and-test-from-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: uv build
      - name: Confirm the sdist excludes tests/
        run: |
          count=$(tar tzf dist/*.tar.gz | grep -c '/tests/' || true)
          echo "tests/ files in sdist: $count"
          test "$count" -eq 0
      - name: Install the built wheel into a clean virtualenv (never this checkout's own src/)
        run: |
          python3 -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install dist/*.whl
      - name: Confirm the vendored signing_config_offline.json actually shipped in the wheel
        run: |
          /tmp/clean-venv/bin/python3 -c "
          from harness_aibom.sign import DEFAULT_SIGNING_CONFIG
          assert DEFAULT_SIGNING_CONFIG.is_file(), 'vendored signing config missing from the installed wheel'
          print('present:', DEFAULT_SIGNING_CONFIG)
          "
      - name: Run scan -> validate -> report -> policy -> diff end to end from the installed artifact
        run: |
          /tmp/clean-venv/bin/harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/a.json
          /tmp/clean-venv/bin/harness-aibom scan --runtime hermes --home tests/fixtures/hermes_home -o /tmp/b.json
          /tmp/clean-venv/bin/harness-aibom validate /tmp/a.json
          /tmp/clean-venv/bin/harness-aibom report /tmp/a.json -o /tmp/report.html
          /tmp/clean-venv/bin/harness-aibom report --diff /tmp/a.json /tmp/b.json -o /tmp/change.html
          /tmp/clean-venv/bin/harness-aibom diff /tmp/a.json /tmp/b.json
          /tmp/clean-venv/bin/harness-aibom policy /tmp/a.json --fail-on high || true
